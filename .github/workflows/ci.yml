name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore AmbientSoundMixer.sln
      - run: dotnet build AmbientSoundMixer.sln -c Release --no-restore
      - run: dotnet test AmbientSoundMixer.sln -c Release --no-build
